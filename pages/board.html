          "firebase/app": "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js",

    <script src="./../js/shared/backend.js"></script>
    <script src="./../js/shared/ui-helpers.js"></script>
    <script src="./../js/shared/signature-helpers.js"></script>

    <!-- Board core modules -->
    <script src="./../js/board/core/board-helpers.js"></script>
    <script src="./../js/board/core/board-ui-helpers.js"></script>
    <script src="./../js/board/core/board-priority.js"></script>
    <script src="./../js/board/core/board-contact-management.js"></script>
    <script src="./../js/board/core/board-contact-navigation.js"></script>
    <script src="./../js/board/core/board-task-render.js"></script>
    <script src="./../js/board/core/board-task-operations.js"></script>
    <script src="./../js/board/core/board-subtasks.js"></script>
    <script src="./../js/board/core/board-init.js"></script>

    <!-- Board supporting files (depend on core modules) -->
    <script src="./../js/board/boardHTML.js"></script>
    <script src="./../js/board/boardEditHTML.js"></script>
    <script src="./../js/board/boardFill.js"></script>
    <script src="./../js/board/boardEdit.js"></script>
    <script src="./../js/board/boardDragSearch.js"></script>

    <title>Board Kanban</title>
  </head>

  <body onload="initBoard()">
    <div
      w3-include-html="../assets/templates/header.html"
      id="mainHeader"
      class="mainHeader"
    ></div>

    <div id="mainContent" class="mainContent">
      <div id="boardMainContainerId" class="boardMainContainer">
        <div class="headBox">
          <div class="mobileHead">
            <h1>Board</h1>
            <img
              onclick="includeContentHTML('addTask')"
              class="boardMobilAddTask"
              src="../assets/img/board/add.svg"
            />
          </div>

          <div class="boardDesktopHeadRight">
            <div class="searchTaskInputField">
              <input
                onkeyup="filterTitles()"
                id="boardSearchInput"
                placeholder="Find Task"
              />
              <img src="../assets/img/board/search.svg" />
            </div>

            <div
              onclick="includeContentHTML('addTask')"
              class="boardDesktopAddTask"
            >
              <p class="boardDesktopAddTaskText">Add Task</p>
              <img src="../assets/img/board/add_white.svg" />
            </div>
          </div>
        </div>

        <!-- TODO - experementel -->
        <!-- <div class="prioFilterBar">
          <button
            onclick="togglePrioFilter('Urgent')"
            id="filterUrgent"
            class="prioFilterBtn prioFilterBtn--urgent"
          >
            <img src="../assets/img/board/board_urgent.svg" />
            <span>Urgent</span>
          </button>

          <button
            onclick="togglePrioFilter('Medium')"
            id="filterMedium"
            class="prioFilterBtn prioFilterBtn--medium"
          >

            <img src="../assets/img/board/board_low.svg" />
            <span>Low</span>
          </button>
        </div> -->

        <div id="taskBoxId" class="taskBox">
          <div class="selectionContainer">
            <div class="headContainer">
              <h2>To do</h2>
              <img
                onclick="addTaskWithStatus('to-do')"
                src="../assets/img/board/add_mobile.svg"
              />
            </div>

            <div
              id="TodoMainContainer"
              ondrop="moveTo('to-do')"
              ondragover="
                allowDrop(event);
                highlight('TodoMainContainer');
              "
              ondragleave="removeHighlight('TodoMainContainer')"
              class="boxesContainer"
            ></div>
          </div>

          <div class="selectionContainer">
            <div class="headContainer">
              <h2>In progress</h2>
              <img
                onclick="addTaskWithStatus('progress')"
                src="../assets/img/board/add_mobile.svg"
              />
            </div>

            <div
              id="progressMainContainer"
              ondrop="moveTo('progress')"
              ondragover="
                allowDrop(event);
                highlight('progressMainContainer');
              "
              ondragleave="removeHighlight('progressMainContainer')"
              class="boxesContainer"
            ></div>
          </div>

          <div class="selectionContainer">
            <div class="headContainer">
              <h2>Await for feedback</h2>
              <img
                onclick="addTaskWithStatus('await')"
                src="../assets/img/board/add_mobile.svg"
              />
            </div>

            <div
              id="awaitMainContainer"
              ondrop="moveTo('await')"
              ondragover="
                allowDrop(event);
                highlight('awaitMainContainer');
              "
              ondragleave="removeHighlight('awaitMainContainer')"
              class="boxesContainer"
            ></div>
          </div>

          <div class="selectionContainer">
            <div class="headContainer">
              <div>
                <h2>Done</h2>
              </div>

              <img
                onclick="addTaskWithStatus('done')"
                src="../assets/img/board/add_mobile.svg"
              />
            </div>

            <div
              id="doneMainContainer"
              ondrop="moveTo('done')"
              ondragover="
                allowDrop(event);
                highlight('doneMainContainer');
              "
              ondragleave="removeHighlight('doneMainContainer')"
              class="boxesContainer"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <div
      w3-include-html="../assets/templates/menu.html"
      id="afterLoginMainMenu"
      class="afterLoginMainMenu"
    ></div>
  </body>
